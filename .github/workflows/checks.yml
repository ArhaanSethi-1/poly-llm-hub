name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Compile Python modules
        run: python -m compileall -q app.py credential_dialog.py hub_core.py history_crypto.py provider_metadata.py secret_store.py tests scripts
      - name: Run local mock suite
        run: python -m unittest discover -s tests -v
      - name: Check inline browser script syntax
        run: python scripts/check_inline_js.py
      - name: Build reviewable source archive
        run: python scripts/build_source_archive.py
